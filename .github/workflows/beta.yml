name: "Beta · вариант Б (вручную)"
run-name: "Beta PR #${{ inputs.pr }} · ${{ inputs.feature }}"

# Бета выпускается ручным запуском из вкладки Actions.
# Запуск идёт из main, поэтому исполняется этот файл из main, даже когда
# собирается код из PR. Код PR собирается в job build без секретов и с правом
# только на чтение; публикация идёт в отдельной job за environment npm-beta,
# которую должен подтвердить reviewer.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Номер pull request"
        type: number
        required: true
      feature:
        description: "Имя фичи, латиница через дефис, напр. context-menu"
        type: string
        required: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - name: Откуда взят этот workflow
        run: |
          echo "=================================================================="
          echo "ВАРИАНТ Б: workflow-файл взят из ${GITHUB_WORKFLOW_REF} (коммит ${GITHUB_WORKFLOW_SHA})"
          echo "=================================================================="
          echo "WORKFLOW SOURCE: main"

      - name: Проверка имени фичи
        env:
          FEATURE: ${{ inputs.feature }}
        run: |
          if ! [[ "$FEATURE" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Имя фичи должно быть латиницей в нижнем регистре через дефис, напр. context-menu"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr }}/head
          persist-credentials: false

      - name: Что собираем
        run: |
          echo "Собираем коммит PR: $(git rev-parse HEAD)"
          echo "package.json из PR:"
          cat package.json

      - name: Версия беты (имитация changeset snapshot)
        id: version
        env:
          FEATURE: ${{ inputs.feature }}
        run: |
          base="$(node -p "require('./package.json').version")"
          IFS=. read -r major minor _ <<< "${base%%-*}"
          short="$(git rev-parse --short=7 HEAD)"
          # Идентификатор prerelease из одних цифр с ведущим нулём semver не принимает.
          if [[ "$short" =~ ^[0-9]+$ ]]; then short="g${short}"; fi
          version="${major}.$((minor + 1)).0-${FEATURE}.${short}"
          echo "Версия беты: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: npm pack (без публикации)
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version
          tarball="$(npm pack --silent | tail -n 1)"
          echo "Tarball: ${tarball}"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-beta
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package

      - name: Публикация (имитация, в npm ничего не уходит)
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TARBALL: ${{ needs.build.outputs.tarball }}
          FEATURE: ${{ inputs.feature }}
        run: |
          ls -l
          echo "Версия: ${VERSION}"
          echo "npm publish ${TARBALL} --tag beta-${FEATURE}"

  label:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ inputs.pr }}
      FEATURE: ${{ inputs.feature }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Метка и комментарий в PR
        run: |
          label="beta-${FEATURE}"
          gh label create "$label" --color 5319e7 --description "Опубликована бета ${label}" || true
          gh api "repos/${GH_REPO}/issues/${PR}/labels" -f "labels[]=${label}" > /dev/null
          body="$(printf 'Бета `%s` опубликована под ярлыком `%s`: `npm i @sandbox/ui-kit@%s`' "$VERSION" "$label" "$label")"
          gh api "repos/${GH_REPO}/issues/${PR}/comments" -f "body=${body}" > /dev/null
          echo "Метка ${label} и комментарий добавлены в PR #${PR}"
